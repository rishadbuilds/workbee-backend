apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
  namespace: workbee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communication-service
  template:
    metadata:
      labels:
        app: communication-service
    spec:
      containers:
        - name: communication-service
          image: rishadkarappa/workbee-communication:latest

          ports:
            - containerPort: 4003
              name: http

          env:
            - name: SERVICE_NAME
              value: "communication-service"

            - name: NODE_ENV
              value: "production"

            - name: LOG_LEVEL
              value: "debug"

            - name: PORT
              value: "4003"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: COMMUNICATION_MONGO_URI

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4001"

            - name: WORK_SERVICE_URL
              value: "http://work-service:4002"

            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: CORS_ORIGIN

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: JWT_SECRET

            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: CLOUDINARY_CLOUD_NAME

            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: CLOUDINARY_API_KEY

            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: CLOUDINARY_API_SECRET

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi