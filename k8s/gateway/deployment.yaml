apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: workbee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: rishadkarappa/workbee-gateway:latest
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: SERVICE_NAME
              value: "gateway"
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "debug"

            - name: AUTH_SERVICE
              value: "http://auth-service:4001"
            - name: WORK_SERVICE
              value: "http://work-service:4002"
            - name: COMMUNICATION_SERVICE
              value: "http://communication-service:4003"
            - name: NOTIFICATION_SERVICE
              value: "http://notification-service:4004"
            - name: PAYMENT_SERVICE
              value: "http://payment-service:4005"

            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: CORS_ORIGIN

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: JWT_SECRET

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: JWT_REFRESH_SECRET

            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: REDIS_PORT

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workbee-secrets
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
